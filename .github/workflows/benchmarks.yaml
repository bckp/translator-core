name: Benchmarks

on:
  push:
    branches: [main, nextgen]
  pull_request:
    branches: [main, nextgen]
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSER_ROOT_VERSION: 3.0.x-dev

jobs:
  benchmark:
    name: PHP ${{ matrix.php }} translation benchmark
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: opcache
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer benchmark -- --store --dump-file=benchmark.xml
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-php-${{ matrix.php }}
          path: |
            benchmark.xml
            .phpbench/storage
          if-no-files-found: error
          retention-days: 30
