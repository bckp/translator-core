name: API compatibility

on:
  push:
    branches: [nextgen]
  pull_request:
    branches: [nextgen]
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSER_ROOT_VERSION: 3.0.x-dev

defaults:
  run:
    working-directory: translator-core

jobs:
  api:
    name: Released API compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: translator-core
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: bckp/translator-neon
          ref: nextgen
          path: translator-neon
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer bc-install
      - name: Verify the checker against HEAD
        run: composer bc-check -- HEAD
      - name: Check against the latest stable 3.x release
        run: composer bc-check
