name: Tests

on:
  push:
    branches: [main, nextgen]
  pull_request:
    branches: [main, nextgen]
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSER_ROOT_VERSION: 3.0.x-dev

jobs:
  quality:
    name: PHPStan 8 and code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer phpstan -- --no-progress
      - run: composer phpcs

  tests:
    name: PHP ${{ matrix.php }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer tests
      - name: Check compiled cache with OPcache
        run: vendor/bin/tester tests/PhpCache.phpt tests/CacheConcurrency.phpt -s -d opcache.enable_cli=1 -d opcache.validate_timestamps=0

  psalm:
    name: Psalm (optional)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer psalm -- --no-progress
        continue-on-error: true

  code_coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/tester -p phpdbg tests -s --coverage ./coverage.xml --coverage-src ./src
      - name: Download php-coveralls
        run: wget https://github.com/php-coveralls/php-coveralls/releases/download/v2.7.0/php-coveralls.phar
      - name: Upload coverage
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: php php-coveralls.phar --verbose --config tests/.coveralls.yml
